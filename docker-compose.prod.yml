# Producción (Oracle Always Free, Ubuntu ARM): Open-Meteo + nginx + Caddy (HTTPS).
# Mismo sync y nginx que docker-compose.yml, pero sin puertos de depuración:
# solo Caddy publica 80/443. Variables en .env junto a este fichero:
#   DOMINIO=marante-meteo.duckdns.org   MARANTE_CLAVE=<clave de la app>
# Uso: docker compose -f docker-compose.prod.yml up -d
# Si cambias el sync aquí, cámbialo también en docker-compose.yml (y viceversa).

volumes:
  open-meteo-data:
  nginx-cache:
  caddy-data:

x-imagen: &imagen
  image: ghcr.io/open-meteo/open-meteo
  volumes:
    - open-meteo-data:/app/data

services:
  sync:
    <<: *imagen
    container_name: marante-meteo-sync
    command:
      - sync
      - dwd_icon,dwd_icon_eu,ncep_gfs013,meteofrance_wave,dwd_ewam,meteofrance_currents,meteofrance_sea_surface_temperature
      - temperature_2m,precipitation,weather_code,cloud_cover,visibility,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,pressure_msl,uv_index,wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,sea_surface_temperature,ocean_u_current,ocean_v_current,sea_level_height_msl
      - --past-days
      - "3"
      - --bounding-box
      - "35.5,-10.5,44.5,4.5"
      - --repeat-interval
      - "30"
    restart: unless-stopped

  api:
    <<: *imagen
    container_name: marante-meteo-api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: marante-meteo-nginx
    depends_on:
      - api
    environment:
      MARANTE_CLAVE: ${MARANTE_CLAVE:?falta MARANTE_CLAVE en .env}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx-cache:/var/cache/nginx/meteo
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: marante-meteo-caddy
    depends_on:
      - nginx
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
